<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AYANUU HUB — Script Library</title>
  <style>
    :root {
      --bg: #09090d;
      --card: rgba(20, 20, 28, 0.84);
      --border: rgba(255, 255, 255, 0.11);
      --accent: #dc283c;
      --accent-soft: rgba(220, 40, 60, 0.18);
      --text: #f5f5f7;
      --muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 15%, rgba(220, 40, 60, 0.22), transparent 40%),
        radial-gradient(circle at 82% 85%, rgba(120, 20, 40, 0.18), transparent 45%),
        var(--bg);
      color: var(--text);
      padding: 28px 18px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 960px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid rgba(220, 40, 60, 0.35);
      color: #ff6b7b;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.6px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .sub {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 26px;
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      padding: 18px;
      border-radius: 18px;
    }

    .search-input {
      width: 100%;
      background: #06060a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cat-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .cat-btn:hover, .cat-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(220, 40, 60, 0.45);
    }

    .card-top {
      margin-bottom: 14px;
    }

    .card-cat {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #ff7585;
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .card h3 {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .card p {
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .code-preview {
      background: #06060a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.76rem;
      color: #d4d4d8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 14px;
    }

    .copy-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 11px;
      padding: 11px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .copy-btn:hover {
      opacity: 0.9;
    }

    .copy-btn:active {
      transform: scale(0.98);
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      color: var(--muted);
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    footer a {
      color: #ff6b7b;
      text-decoration: none;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #181822;
      color: #fff;
      border: 1px solid rgba(220, 40, 60, 0.55);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: all 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <span class="badge">AYANUU HUB</span>
      <h1>Script Library</h1>
      <p class="sub">Category select karein ya keyword se search karein. Copy par click karein aur use karein.</p>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search scripts by name or game..." />
      <div class="categories" id="categoryButtons">
        <button class="cat-btn active" data-cat="All">All</button>
        <button class="cat-btn" data-cat="Blox Fruits">Blox Fruits</button>
        <button class="cat-btn" data-cat="Universal">Universal</button>
        <button class="cat-btn" data-cat="Utility">Utility</button>
      </div>
    </div>

    <div class="grid" id="scriptGrid"></div>

    <footer>
      Built by <strong>AYANUU HUB</strong> • Hosted on GitHub Pages
    </footer>
  </div>

  <div id="toast" class="toast">Script Copied!</div>

  <script>
    // ==========================================
    // YAHAN APNI NAYI SCRIPTS ADD KAREIN
    // ==========================================
    const SCRIPTS = [
      {
        name: "AYANUU Main Hub",
        category: "Blox Fruits",
        description: "Auto farm, boss kill, aur fast teleportation features ke sath.",
        code: 'loadstring(game:HttpGet("https://githubusercontent.com"))()'
      },
      {
        name: "Infinite Yield Admin",
        category: "Universal",
        description: "Har game mein kaam karne wala famous admin commands script.",
        code: 'loadstring(game:HttpGet("https://githubusercontent.com"))()'
      },
      {
        name: "FPS Booster & Anti-Lag",
        category: "Utility",
        description: "Low-end devices par lag kam karne aur FPS barhane ke liye.",
        code: 'loadstring(game:HttpGet("https://githubusercontent.com"))()'
      }
    ];

    const grid = document.getElementById("scriptGrid");
    const searchInput = document.getElementById("searchInput");
    const catButtons = document.querySelectorAll(".cat-btn");
    const toast = document.getElementById("toast");

    let activeCategory = "All";

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    }

    async function copyCode(text, name) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(`${name} copied!`);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast(`${name} copied!`);
      }
    }

    function renderScripts() {
      const query = searchInput.value.toLowerCase().trim();
      grid.innerHTML = "";

      const filtered = SCRIPTS.filter(item => {
        const matchesCat = activeCategory === "All" || item.category === activeCategory;
        const matchesSearch =
          item.name.toLowerCase().includes(query) ||
          item.description.toLowerCase().includes(query) ||
          item.category.toLowerCase().includes(query);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty">Koi matching script nahi mili. Doosra keyword try karein.</div>`;
        return;
      }

      filtered.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-top">
            <span class="card-cat">${item.category}</span>
            <h3>${item.name}</h3>
            <p>${item.description}</p>
            <div class="code-preview">${item.code}</div>
          </div>
          <button class="copy-btn" data-index="${index}">Copy Script</button>
        `;

        card.querySelector(".copy-btn").addEventListener("click", () => {
          copyCode(item.code, item.name);
        });

        grid.appendChild(card);
      });
    }

    catButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        catButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCategory = btn.dataset.cat;
        renderScripts();
      });
    });

    searchInput.addEventListener("input", renderScripts);
renderScripts();
